dependencies = [
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.15.0",
    "django-request>=1.7.1",
    "email-validator>=2.3.0",
    "fastapi>=0.116.0",
    "httpx>=0.28.1",
    "pwdlib[argon2]>=0.3.0",
    "pyjwt>=2.10.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
    "requests>=2.34.2",
    "sqlalchemy>=2.0.51",
    "uvicorn[standard]>=0.35.0",
